# Marumado's Docker image, published to GitHub's registry so nobody has to build it: the desktop app runs it
# (desktop/src-tauri/src/host.rs), pinned to its own version, and `docker compose` can use it instead of a build.
#   a tag vX.Y.Z  → ghcr.io/<owner>/marumado:X.Y.Z and :latest (what the app of that version runs)
#   main          → :main
# A release: set the version in desktop/src-tauri/tauri.conf.json and Cargo.toml, then push the tag vX.Y.Z.
name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['desktop/**', 'docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag is the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          if [ "v$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME, but desktop/src-tauri/tauri.conf.json says $app: the app would run another image"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/marumado
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
