<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starting · Marumado</title>
    <!-- Shown while the app starts the Marumado on this machine (docker compose up -d); the app then loads Marumado
         in its place. window.failed(message), called by the app, says why it couldn't. -->
    <style>
      :root {
        --ground: #ecebe4;
        --ink: #23231f;
        --ink-2: #57564f;
        --signal-text: #a3411f;
        --f-sans: 'Iosevka Aile', ui-sans-serif, system-ui, sans-serif;
        --f-mono: 'Iosevka', ui-monospace, 'SFMono-Regular', monospace;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #22221f;
          --ink: #eeebe3;
          --ink-2: #bdbab0;
          --signal-text: #ec8a5c;
          color-scheme: dark;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        box-sizing: border-box;
        background: var(--ground);
        color: var(--ink);
        font: 400 16px/1.5 var(--f-sans);
        text-align: center;
      }
      main {
        width: min(440px, 100%);
        display: grid;
        justify-items: center;
        gap: 14px;
      }
      svg {
        width: 56px;
        height: 56px;
      }
      .ring {
        transform-origin: 16px 16px;
        animation: turn 1.6s linear infinite;
      }
      .ring--in {
        animation-duration: 2.4s;
        animation-direction: reverse;
      }
      @keyframes turn {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ring {
          animation: none;
        }
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--ink-2);
        font-size: 14px;
      }
      code {
        font-family: var(--f-mono);
        font-size: 0.92em;
      }
      #problem {
        color: var(--signal-text);
        overflow-wrap: anywhere;
      }
      #problem:empty,
      .failed #wait,
      #after {
        display: none;
      }
      .failed #after {
        display: block;
      }
      .failed .ring {
        animation: none;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle class="ring" cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="60 31" />
        <circle class="ring ring--in" cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="40 29" />
        <circle cx="16" cy="16" r="7.5" fill="currentColor" />
      </svg>
      <h1 id="title" role="status">Starting Marumado…</h1>
      <p id="wait">Its containers are coming up. This window opens Marumado as soon as it answers.</p>
      <p id="problem" role="alert"></p>
      <p id="after">Start it with <code>make up</code> in Marumado’s folder: this window opens it as soon as it answers.</p>
    </main>
    <script>
      window.failed = (message) => {
        document.body.classList.add('failed')
        document.getElementById('title').textContent = 'Marumado didn’t start'
        document.getElementById('problem').textContent = message.charAt(0).toUpperCase() + message.slice(1) + (/[.?!]$/.test(message) ? '' : '.')
      }
    </script>
  </body>
</html>
