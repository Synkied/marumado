<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starting · Marumado</title>
    <!-- Shown while the app starts the Marumado on this machine (docker compose up -d); the app then loads Marumado
         in its place. window.step(text) says what it is doing (downloading Marumado); window.failed(message, after) says why it
         couldn't, and what to do (HTML). Both are called by the app. -->
    <style>
      /* Marumado's Braun T3 look (frontend/src/tokens.css). */
      :root {
        --ground: #e7e5e0;
        --ink: #1c1c1b;
        --ink-2: #5f5e5a;
        --signal-text: #b5400b;
        --f-sans: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif;
        --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #1b1b1a;
          --ink: #ecebe7;
          --ink-2: #a9a7a1;
          --signal-text: #ff8a55;
          color-scheme: dark;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        box-sizing: border-box;
        background: var(--ground);
        color: var(--ink);
        font: 400 16px/1.5 var(--f-sans);
        text-align: center;
      }
      main {
        width: min(440px, 100%);
        display: grid;
        justify-items: center;
        gap: 14px;
      }
      svg {
        width: 56px;
        height: 56px;
      }
      .ring {
        transform-origin: 16px 16px;
        animation: turn 1.6s linear infinite;
      }
      @keyframes turn {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ring {
          animation: none;
        }
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--ink-2);
        font-size: 14px;
      }
      code {
        font-family: var(--f-mono);
        font-size: 0.92em;
      }
      #problem {
        color: var(--signal-text);
        overflow-wrap: anywhere;
      }
      #problem:empty,
      .failed #wait,
      #after {
        display: none;
      }
      .failed #after {
        display: block;
      }
      .failed .ring {
        animation: none;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="13.5" fill="none" stroke="currentColor" stroke-opacity="0.18" stroke-width="3" />
        <circle class="ring" cx="16" cy="16" r="13.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="22 63" />
        <circle cx="16" cy="16" r="6" fill="currentColor" />
      </svg>
      <h1 id="title" role="status">Starting Marumado…</h1>
      <p id="wait">Its container is coming up. This window opens Marumado as soon as it answers.</p>
      <p id="problem" role="alert"></p>
      <p id="after">Start it with <code>make up</code> in Marumado’s folder: this window opens it as soon as it answers.</p>
    </main>
    <script>
      window.step = (text) => {
        document.getElementById('wait').textContent = text
      }
      window.failed = (message, after) => {
        if (after) document.getElementById('after').innerHTML = after
        document.body.classList.add('failed')
        document.getElementById('title').textContent = 'Marumado didn’t start'
        document.getElementById('problem').textContent = message.charAt(0).toUpperCase() + message.slice(1) + (/[.?!]$/.test(message) ? '' : '.')
      }
    </script>
  </body>
</html>
